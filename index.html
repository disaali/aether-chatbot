<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether · Groq Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <style>
    :root {
      --ink: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.62);
      --glass: rgba(12, 10, 18, 0.48);
      --stroke: rgba(255, 255, 255, 0.1);
      --accent: #7cf0d4;
      --accent-2: #c9a8ff;
      --user: linear-gradient(135deg, #7cf0d4, #6aa8ff);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      color: var(--ink);
      font-family: "Sora", system-ui, sans-serif;
      background: #05040a;
      overflow: hidden;
    }

    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(124, 240, 212, 0.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(201, 168, 255, 0.22), transparent 50%),
        radial-gradient(800px 500px at 50% 110%, rgba(106, 168, 255, 0.16), transparent 45%),
        linear-gradient(180deg, #07060f 0%, #0b0816 45%, #120c1c 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
      animation: drift 22s ease-in-out infinite;
    }
    .orb.a { width: 380px; height: 380px; left: 28%; top: 8%; background: #3de8c4; animation-duration: 18s; }
    .orb.b { width: 460px; height: 460px; right: -120px; top: -60px; background: #8b6cff; animation-duration: 26s; animation-delay: -6s; }
    .orb.c { width: 320px; height: 320px; right: 22%; bottom: -90px; background: #4f8dff; animation-duration: 20s; animation-delay: -10s; }

    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.09;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(40px, -30px, 0) scale(1.12); }
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
      gap: 14px;
      padding: 14px;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      backdrop-filter: blur(28px) saturate(140%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 18px;
      min-height: 0;
      background: rgba(8, 7, 14, 0.72);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: conic-gradient(from 140deg, #7cf0d4, #6aa8ff, #c9a8ff, #7cf0d4);
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(124, 240, 212, 0.35);
    }
    .mark span {
      width: 16px; height: 16px; border-radius: 50%;
      background: #05040a;
    }

    .brand h1 {
      font-family: "Instrument Serif", serif;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.03em;
    }
    .brand p { font-size: 11px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }

    .new-chat {
      border: 1px solid rgba(124, 240, 212, 0.35);
      background: linear-gradient(180deg, rgba(124,240,212,0.16), rgba(124,240,212,0.04));
      color: var(--ink);
      border-radius: 14px;
      padding: 11px 12px;
      font: inherit;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .new-chat:hover { background: rgba(124,240,212,0.22); }

    .thread-list {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex: 1;
    }

    .thread {
      text-align: left;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.03);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }
    .thread.active, .thread:hover {
      border-color: var(--stroke);
      background: rgba(255,255,255,0.07);
    }
    .thread small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }

    .stage {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      min-height: 0;
    }

    header.top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--stroke);
    }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    select, input[type="range"] {
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      font-size: 12px;
    }
    option { color: #111; }

    .key-warn {
      font-size: 12px;
      color: #ffb4a8;
      display: none;
    }
    .key-warn.show { display: block; }

    .feed {
      overflow: auto;
      padding: 28px 8% 16px;
    }

    .hero {
      max-width: 720px;
      margin: 8vh auto 0;
      text-align: center;
    }
    .hero h2 {
      font-family: "Instrument Serif", serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 400;
      line-height: 1.05;
    }
    .hero h2 em { font-style: italic; color: var(--accent); }
    .hero p { margin: 14px auto 28px; max-width: 520px; color: var(--muted); }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 640px;
      margin: 0 auto;
    }
    .chip {
      text-align: left;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--stroke);
      color: var(--ink);
      border-radius: 16px;
      padding: 14px;
      font: inherit;
      cursor: pointer;
    }
    .chip:hover { border-color: rgba(124,240,212,0.45); }

    .msg {
      max-width: 780px;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
    }
    .msg.user { grid-template-columns: 1fr 38px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.08);
    }
    .msg.user .avatar { background: var(--user); color: #04120e; }
    .bubble {
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 14px 16px;
      line-height: 1.65;
      font-size: 14.5px;
    }
    .msg.user .bubble {
      background: linear-gradient(180deg, rgba(124,240,212,0.16), rgba(106,168,255,0.08));
    }
    .bubble p + p { margin-top: 10px; }
    .bubble pre {
      overflow: auto;
      background: rgba(0,0,0,0.35);
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 8px 0; }
    .think {
      font-size: 12px;
      color: var(--muted);
      border-left: 2px solid rgba(201,168,255,0.45);
      padding: 0 0 10px 12px;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .composer-wrap {
      padding: 8px 8% 18px;
    }
    .composer {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(8, 8, 14, 0.55);
      border: 1px solid var(--stroke);
      box-shadow: 0 0 0 1px rgba(124,240,212,0.08), 0 20px 50px rgba(0,0,0,0.35);
    }
    textarea {
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      min-height: 52px;
      max-height: 160px;
      padding: 10px 8px;
    }
    .send {
      width: 48px; height: 48px;
      border: 0; border-radius: 14px;
      background: var(--user);
      color: #04120e;
      font-weight: 700;
      cursor: pointer;
      align-self: end;
    }
    .send:disabled { opacity: 0.4; cursor: not-allowed; }

    .typing span {
      display: inline-block;
      width: 6px; height: 6px; margin-right: 4px;
      border-radius: 50%; background: var(--accent);
      animation: blink 1.1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; padding: 8px; }
      .sidebar { display: none; }
      .suggestions { grid-template-columns: 1fr; }
      .feed, .composer-wrap { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="noise"></div>
  </div>

  <div class="app">
    <aside class="panel sidebar">
      <div class="brand">
        <div class="mark"><span></span></div>
        <div>
          <h1>Aether</h1>
          <p>Groq intelligence</p>
        </div>
      </div>
      <button class="new-chat" id="newChat">+ New conversation</button>
      <div class="thread-list" id="threads"></div>
    </aside>

    <main class="panel stage">
      <header class="top">
        <div>
          <strong id="title">New conversation</strong>
          <div class="key-warn" id="keyWarn">Add GROQ_API_KEY to .env, then restart the server.</div>
        </div>
        <div class="controls">
          <select id="model"></select>
          <select id="effort">
            <option value="low">Think light</option>
            <option value="medium" selected>Think medium</option>
            <option value="high">Think deep</option>
          </select>
        </div>
      </header>

      <section class="feed" id="feed"></section>

      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="input" placeholder="Ask anything. Aether streams the answer live." rows="2"></textarea>
          <button class="send" id="send" type="submit">↑</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const PROMPTS = [
      ["Design a weekend", "Plan a 48-hour creative reset in my city with food, walking, and one surprise."],
      ["Ship faster", "Give me a ruthless 7-day plan to finish a side project I keep stalling on."],
      ["Explain like fire", "Explain quantum entanglement as a short story I’d actually remember."],
      ["Write like me", "Turn this idea into a landing page hero, three features, and a CTA: AI that feels cinematic."]
    ];

    const storeKey = "aether.threads.v1";
    let config = { models: [], defaultModel: "openai/gpt-oss-120b", hasKey: true };
    let threads = JSON.parse(localStorage.getItem(storeKey) || "[]");
    let activeId = threads[0]?.id || null;
    let busy = false;

    const feed = document.getElementById("feed");
    const threadsEl = document.getElementById("threads");
    const modelEl = document.getElementById("model");
    const effortEl = document.getElementById("effort");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const title = document.getElementById("title");

    marked.setOptions({ breaks: true });

    function uid() { return crypto.randomUUID(); }
    function save() { localStorage.setItem(storeKey, JSON.stringify(threads)); }
    function active() { return threads.find(t => t.id === activeId); }

    function renderMd(text) {
      return DOMPurify.sanitize(marked.parse(text || ""));
    }

    function emptyHero() {
      feed.innerHTML = `
        <div class="hero">
          <h2>Think in <em>light</em>.<br/>Ship in motion.</h2>
          <p>A streaming Groq studio with a living background, memory, and a companion that writes like it means it.</p>
          <div class="suggestions">
            ${PROMPTS.map(([k, v]) => `<button class="chip" data-prompt="${encodeURIComponent(v)}"><strong>${k}</strong><div style="color:var(--muted);margin-top:6px;font-size:12px">${v}</div></button>`).join("")}
          </div>
        </div>`;
      feed.querySelectorAll(".chip").forEach(btn => {
        btn.onclick = () => sendMessage(decodeURIComponent(btn.dataset.prompt));
      });
    }

    function renderThreads() {
      threadsEl.innerHTML = threads.map(t => `
        <button class="thread ${t.id === activeId ? "active" : ""}" data-id="${t.id}">
          ${t.title}
          <small>${t.messages.length} messages</small>
        </button>`).join("");
      threadsEl.querySelectorAll(".thread").forEach(btn => {
        btn.onclick = () => { activeId = btn.dataset.id; render(); };
      });
    }

    function renderMessages() {
      const t = active();
      if (!t || !t.messages.length) { emptyHero(); return; }
      title.textContent = t.title;
      feed.innerHTML = t.messages.map(m => {
        const who = m.role === "user" ? "You" : "Æ";
        return `
          <article class="msg ${m.role}">
            ${m.role === "user" ? "" : `<div class="avatar">${who}</div>`}
            <div class="bubble">${
              m.role === "user"
                ? escapeHtml(m.content).replace(/\n/g, "<br>")
                : (m.reasoning ? `<div class="think">${escapeHtml(m.reasoning)}</div>` : "") + renderMd(m.content)
            }</div>
            ${m.role === "user" ? `<div class="avatar">You</div>` : ""}
          </article>`;
      }).join("");
      feed.scrollTop = feed.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      if (!activeId) emptyHero();
      else renderMessages();
      renderThreads();
      title.textContent = active()?.title || "New conversation";
    }

    function ensureThread() {
      if (active()) return active();
      const t = { id: uid(), title: "New conversation", messages: [] };
      threads.unshift(t);
      activeId = t.id;
      save();
      return t;
    }

    async function sendMessage(text) {
      const content = (text || input.value).trim();
      if (!content || busy) return;
      const t = ensureThread();
      if (t.messages.length === 0) t.title = content.slice(0, 42);
      t.messages.push({ role: "user", content });
      input.value = "";
      autosize();
      save();
      renderMessages();
      renderThreads();

      const assistant = { role: "assistant", content: "", reasoning: "" };
      t.messages.push(assistant);
      const wrap = document.createElement("article");
      wrap.className = "msg assistant";
      wrap.innerHTML = `<div class="avatar">Æ</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
      if (!feed.querySelector(".msg")) feed.innerHTML = "";
      feed.appendChild(wrap);
      const bubble = wrap.querySelector(".bubble");
      feed.scrollTop = feed.scrollHeight;
      const paint = () => {
        bubble.classList.remove("typing");
        const think = assistant.reasoning
          ? `<div class="think">${escapeHtml(assistant.reasoning)}</div>`
          : "";
        bubble.innerHTML = think + renderMd(assistant.content);
        feed.scrollTop = feed.scrollHeight;
      };

      busy = true;
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: t.messages.slice(0, -1),
            model: modelEl.value,
            reasoning_effort: effortEl.value,
            temperature: 0.8,
            max_tokens: 4096
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || "Chat failed");
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.replace(/^data:\s*/, "");
            if (!line) continue;
            const data = JSON.parse(line);
            if (data.error) throw new Error(data.error);
            if (data.reasoning) assistant.reasoning += data.reasoning;
            if (data.text) assistant.content += data.text;
            if (data.reasoning || data.text) paint();
          }
        }
        if (!assistant.content && assistant.reasoning) {
          assistant.content = assistant.reasoning;
          assistant.reasoning = "";
        }
        if (!assistant.content) assistant.content = "I didn’t get a reply. Check your API key and model.";
        paint();
      } catch (err) {
        assistant.content = "Something went wrong: " + err.message;
        bubble.classList.remove("typing");
        bubble.textContent = assistant.content;
      } finally {
        busy = false;
        send.disabled = false;
        save();
        renderThreads();
        input.focus();
      }
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage();
    });
    input.addEventListener("input", autosize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById("newChat").onclick = () => {
      activeId = null;
      render();
      input.focus();
    };

    (async () => {
      try {
        config = await fetch("/api/config").then(r => r.json());
      } catch {}
      document.getElementById("keyWarn").classList.toggle("show", !config.hasKey);
      modelEl.innerHTML = (config.models || []).map(m =>
        `<option value="${m.id}">${m.label} · ${m.tag}</option>`
      ).join("");
      modelEl.value = config.defaultModel;
      render();
      input.focus();
    })();
  </script>
</body>
</html>
